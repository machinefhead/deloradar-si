name: DeloRadar – pilot posameznih oglasov (brez objave)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preveri razčlenjevanje
        run: npm test
      - name: Preveri ZRSZ dnevni JSON in prvih 10 neposrednih povezav brez brskalnika
        run: node scripts/import-zrsz-official-local.mjs 10
