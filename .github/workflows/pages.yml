name: DeloRadar – osveži oglase in objavi

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Namesti odvisnosti
        run: npm ci
      - name: Preveri kodo
        run: npm test
      - name: Pridobi oglase in zgradi stran
        run: npm run build
        env:
          ZRSZ_JSON_URL: ${{ secrets.ZRSZ_JSON_URL }}
          ZRSZ_BROWSER_ENABLED: '1'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
