name: DeloRadar – osveži oglase in objavi

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Način objave (UI brez zajema ali celoten zajem)'
        required: true
        default: full
        type: choice
        options:
          - full
          - ui

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Namesti odvisnosti
        run: npm ci
      - name: Preveri kodo
        run: npm test
      - name: Pripravi samo videz iz zadnjega javnega posnetka
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ui')
        run: npm run build:ui
      - name: Pridobi oglase in zgradi stran
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          ZRSZ_OFFICIAL_HTTP_ENABLED: '1'
          ZRSZ_VERIFY_NEW_LIMIT: '60'
          EURES_HTTP_ENABLED: '1'
          DELORADAR_REQUIRE_ALL_SOURCES: '1'
          CAREERJET_DATA_API_KEY: ${{ secrets.CAREERJET_DATA_API_KEY }}
          DETAIL_OPTIUS_LIMIT: '8'
          DETAIL_KARIERA_LIMIT: '20'
          DETAIL_MOJEDELO_LIMIT: '100'
          DETAIL_ZAPOSLITEV_LIMIT: '20'
          DETAIL_MANPOWER_LIMIT: '20'
          DETAIL_WHC_LIMIT: '24'
          LINKEDIN_DM_SCAN_LIMIT: '480'
        run: npm run build
      - name: Preveri dejansko stran in deljive povezave
        run: node scripts/test-browser.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
