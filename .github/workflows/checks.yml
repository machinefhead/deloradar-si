name: Preverjanje sprememb

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Namesti odvisnosti
        run: npm ci
      - name: Preveri JavaScript in parserje
        run: npm test
      - name: Preveri dejanski zajem tudi na GitHubu
        env:
          ZRSZ_OFFICIAL_HTTP_ENABLED: '1'
          EURES_HTTP_ENABLED: '1'
          DELORADAR_REQUIRE_ALL_SOURCES: '1'
          DELORADAR_REQUIRE_WHC: '1'
          ZRSZ_VERIFY_NEW_LIMIT: '10'
          DETAIL_MOJEDELO_LIMIT: '30'
          DETAIL_WHC_LIMIT: '4'
          DETAIL_MANPOWER_LIMIT: '4'
          DETAIL_SMARTRECRUITERS_LIMIT: '2'
          DETAIL_NOVARTIS_LIMIT: '4'
        run: npm run build
      - name: Preveri podrobnosti oglasov v brskalniku in na telefonu
        run: node scripts/test-browser.mjs
