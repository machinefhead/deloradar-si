name: Preverjanje sprememb

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Namesti odvisnosti
        run: npm ci
      - name: Preveri JavaScript in parserje
        run: npm test
      - name: Preveri dejanski zajem tudi na GitHubu
        run: npm run build
        env:
          ZRSZ_BROWSER_ENABLED: '1'
          ZRSZ_DIRECT_LINK_LIMIT: '60'
          ZRSZ_LINKS_REQUIRED: '1'
      - name: Preveri podrobnosti oglasov v brskalniku in na telefonu
        run: node scripts/test-browser.mjs
