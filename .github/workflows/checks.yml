name: Preverjanje sprememb

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Namesti odvisnosti
        run: npm ci
      - name: Preveri JavaScript in parserje
        run: npm test
      - name: Preveri videz z zadnjim javnim posnetkom brez obiska portalov
        run: npm run build:ui
      - name: Preveri novi Mjob v GitHub okolju (samo tri podrobnosti)
        if: contains(github.event.pull_request.title, '[import:mjob]')
        env:
          INCREMENTAL_SOURCE: mjob
          MJOB_NEW_LIMIT: '3'
        run: npm run build:incremental
      - name: Preveri novi Krkin javni seznam v GitHub okolju (ena poizvedba)
        if: contains(github.event.pull_request.title, '[import:krka]')
        env:
          INCREMENTAL_SOURCE: krka
        run: npm run build:incremental
      - name: Preveri uradne Telekomove razpise (samo ta vir)
        if: contains(github.event.pull_request.title, '[import:telekom]')
        env:
          INCREMENTAL_SOURCE: telekom
        run: npm run build:incremental
      - name: Preveri dva izvirna oglasa A1 Slovenija (samo ta vir)
        if: contains(github.event.pull_request.title, '[import:a1]')
        env:
          INCREMENTAL_SOURCE: a1
        run: npm run build:incremental
      - name: Preveri podrobnosti oglasov v brskalniku in na telefonu
        run: node scripts/test-browser.mjs
